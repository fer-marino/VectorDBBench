vectorchordivf:
  - db_label: vchordrq-m8
    user_name: postgres
    password: postgres
    db_name: vectordb
    host: localhost
    port: 5433
    drop_old: true
    load: true
    search_serial: true
    search_concurrent: true
    num_concurrency: "1,10,20"
    concurrency_duration: 15
    case_type: Performance1536D500K
    maintenance_work_mem: "2GB"
    max_parallel_workers: 12
    # Specific to VectorChord
    residual_quantization: "True"
    spherical_centroids: "True"
    lists: 100        # Roughly equivalent to providing a good cluster granularity
    probes: 10         # Directly corresponds to your search effort (ef_search)
