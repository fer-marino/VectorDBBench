# Tuned PostgreSQL configuration for VectorDBBench on 6C/12T CPU, 16 GB RAM, NVMe
# Durability preserved (synchronous_commit=on); no UNLOGGED tables implied.
listen_addresses='*'
# Memory
shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 64MB
maintenance_work_mem = 1GB

# Parallelism
max_worker_processes = 24
max_parallel_workers = 8
max_parallel_maintenance_workers = 3
max_parallel_workers_per_gather = 3

# WAL and checkpoints (durable but optimized)
wal_level = replica
synchronous_commit = on
checkpoint_timeout = 15min
max_wal_size = 12GB
checkpoint_completion_target = 0.9

# Planner / I/O (NVMe)
random_page_cost = 1.1
effective_io_concurrency = 200

# Autovacuum
autovacuum = on

# Logging (optional; uncomment to increase verbosity during tuning)
#log_min_duration_statement = 250ms
#shared_preload_libraries = ''
